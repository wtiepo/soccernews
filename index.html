<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoccerNews · Notícias e placares de futebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><i></i>SoccerNews</div>
    <input id="q" type="search" placeholder="Buscar time, jogador ou assunto" aria-label="Buscar notícias">
    <button id="tema" class="toggle" type="button" role="switch" aria-checked="false" aria-label="Alternar entre DayMode e NightMode"><span class="lbl">DAYMODE</span><span class="knob"><svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button>
  </div>
  <nav class="chips" id="chips" aria-label="Filtros"></nav>
</header>

<main>
  <div class="notice" id="notice" hidden></div>
  <section id="news" aria-live="polite"><p class="meta">Carregando notícias…</p></section>
  <aside>
    <div class="live">
      <h2><span class="dot"></span>Ao vivo agora</h2>
      <div class="meta" id="liveInfo" style="color:#9db3a5"></div>
      <div id="live"></div>
    </div>
  </aside>
</main>


<script src="script.js"></script>
</body>
</html>
